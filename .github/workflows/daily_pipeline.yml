name: Daily Market Intelligence Pipeline

on:
  schedule:
    # Corre todos los días de lunes a viernes a las 22:00 UTC (después del cierre de Wall Street)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Esto nos permite ejecutarlo manualmente cuando queramos con un botón

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance google-cloud-bigquery pandas db-dtypes pyarrow

      - name: Authenticate with Google Cloud
        env:
          GCP_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_KEY" > gcp_key.json

      - name: Ingest latest market data to BigQuery
        run: |
          python extract_and_load.py

      - name: Generate updated dashboard
        run: |
          python generate_dashboard.py

      - name: Clean up secrets
        run: |
          rm gcp_key.json

      - name: Commit and push updated dashboard
        run: |
          git config --global user.name "MarketBot [GitHub Action]"
          git config --global user.email "action@github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated daily market update [skip ci]" && git push)
